[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge-ai"
version = "1.0.0"
description = "A Multi-Agent AI Framework for Automated Data Analysis and Business Insight Generation"
readme = "README.md"
authors = [{ name = "Palak Parihar" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "google-generativeai>=0.8.0",
    "fpdf2>=2.8.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mlflow>=2.15.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
